<!doctype html>
<html lang="en" theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actress</title>
    <link rel="icon" type="image/png" href="./favicon/flay_2.png" />
    <!-- HtmlWebpackPlugin이 자동으로 CSS와 JS를 주입합니다 -->
  </head>
  <body>
    <header class="sticky">
      <div>
        <div class="header-side left filter-list">
          <div class="rank-summary" id="rankSummary" title="평균 랭크(0 제외) : instance 🆚 archive"></div>
          <div class="rank-filter">
            <input type="checkbox" id="rank-1" value="-1" /><label for="rank-1">-1</label>
            <input type="checkbox" id="rank0" value="0" /><label for="rank0">0</label>
            <input type="checkbox" id="rank1" value="1" /><label for="rank1">1</label>
            <input type="checkbox" id="rank2" value="2" /><label for="rank2">2</label>
            <input type="checkbox" id="rank3" value="3" /><label for="rank3">3</label>
            <input type="checkbox" id="rank4" value="4" /><label for="rank4">4</label>
            <input type="checkbox" id="rank5" value="5" /><label for="rank5">5</label>
          </div>
          <div class="like-filter">
            <input type="checkbox" id="likeYes" value="liked" /><label for="likeYes" title="shot(video.likes) 이 있는 것만">Shot</label>
            <input type="checkbox" id="likeNo" value="unliked" /><label for="likeNo" title="shot(video.likes) 이 없는 것만">No shot</label>
          </div>
          <div class="archive-filter">
            <button id="toggleArchive" title="toggle Archive" data-archive="on"></button>
          </div>
        </div>
        <div class="header-center">
          <div class="actress-info">
            <input type="checkbox" id="favorite" />
            <label for="favorite" title="favorite"></label>
            <input type="text" id="name" placeholder="name..." />
            <input type="text" id="localName" placeholder="localName..." />
            <button id="saveBtn">Save</button>
          </div>
          <div class="actress-info">
            <input type="text" id="birth" placeholder="birth..." />
            <input type="text" id="age" title="age" readonly />
            <input type="text" id="body" placeholder="body..." />
            <input type="number" id="height" placeholder="height..." />
            <input type="number" id="debut" placeholder="debut" />
            <button id="searchAvdbsBtn" title="search actress www.avdbs.com">Avdbs</button>
            <button id="searchMinnanoBtn" title="search actress www.minnano-av.com">Minnano</button>
            <button id="searchAI" title="search actress info by AI">AI</button>
          </div>
          <div class="actress-info">
            <input type="text" id="otherNames" placeholder="other names..." />
          </div>
          <div class="actress-info">
            <textarea id="comment"></textarea>
          </div>
        </div>
        <div class="header-side right tag-list"></div>
      </div>
    </header>
    <article></article>
    <footer></footer>
    <div id="floating-panel">
      <div id="summary" class="summary"></div>
      <div class="ai-meta"></div>
      <button class="close-btn" title="닫기">❌</button>
    </div>
  </body>
</html>
